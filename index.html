<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalvaMoney - Dark Blue Edition</title>
<!-- Nova fonte: Montserrat para um visual mais moderno -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, remove, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAyWmlKrGgsqXcS2Si1vduhvEHQ1swaAPQ",
  authDomain: "porquimdocd.firebaseapp.com",
  databaseURL: "https://porquimdocd-default-rtdb.firebaseio.com",
  projectId: "porquimdocd",
  storageBucket: "porquimdocd.firebasestorage.app",
  messagingSenderId: "307496044520",
  appId: "1:307496044520:web:bc98dd4f93b7ac891e465d",
  measurementId: "G-MEPWDEVVF6"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let currentUser  = null;
let currentGroup = null;
let viewYear     = new Date().getFullYear();
let viewMonth    = new Date().getMonth();
let catChart     = null;
let unsub        = null;

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho',
                 'Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAT_COLORS = {
  'Alimentação':'#ffeb3b','Moradia':'#ffffff','Transporte':'#00dcff',
  'Saúde':'#ff5252','Lazer':'#e040fb','Educação':'#18ffff',
  'Roupas':'#7cffcb','Academia':'#ff6e40','Outros':'#cfd8dc'
};

function fmt(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function monthKey() { return `${viewYear}_${viewMonth}`; }
function expPath()  { return `grupos/${currentGroup}/usuarios/${currentUser}/gastos/${monthKey()}`; }
function billPath() { return `grupos/${currentGroup}/contas/${monthKey()}`; }
function budgetPath(){ return `grupos/${currentGroup}/usuarios/${currentUser}/orcamento/${monthKey()}`; }

window.entrar = async function() {
  const nome  = document.getElementById('l-nome').value.trim();
  const grupo = document.getElementById('l-grupo').value.trim().toUpperCase();
  const acao  = document.querySelector('input[name="acao"]:checked').value;

  if (!nome)  { showMsg('login-msg','Informe seu nome.','err'); return; }
  if (!grupo) { showMsg('login-msg','Informe o código do grupo.','err'); return; }

  if (acao === 'criar') {
    const snap = await get(ref(db, `grupos/${grupo}`));
    if (snap.exists()) { showMsg('login-msg','Esse código já existe.','err'); return; }
    await set(ref(db, `grupos/${grupo}/info`), { criador: nome, criado: Date.now() });
  }

  currentUser  = nome;
  currentGroup = grupo;
  localStorage.setItem('fin_user',  nome);
  localStorage.setItem('fin_group', grupo);

  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display   = 'block';
  document.getElementById('header-user').textContent = nome;
  document.getElementById('header-group').textContent = grupo;
  document.getElementById('exp-date').valueAsDate = new Date();
  startListeners();
  render();
}

window.sair = function() {
  localStorage.removeItem('fin_user');
  localStorage.removeItem('fin_group');
  location.reload();
}

function showMsg(id, txt, type) {
  const el = document.getElementById(id);
  el.textContent = txt;
  el.style.color = type === 'err' ? '#ff5252' : '#87ceeb';
}

function startListeners() {
  if (unsub) unsub();
  const billRef = ref(db, billPath());
  unsub = onValue(billRef, () => { renderBills(); updateSummary(); });
}

window.changeMonth = function(d) {
  viewMonth += d;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth <  0) { viewMonth = 11; viewYear--; }
  startListeners();
  render();
}

window.addExpense = async function() {
  const desc  = document.getElementById('exp-desc').value.trim();
  const value = parseFloat(document.getElementById('exp-value').value);
  const cat   = document.getElementById('exp-cat').value;
  const date  = document.getElementById('exp-date').value;
  const budgetVal = parseFloat(document.getElementById('budget-input').value);

  if (!desc || !value || !date) { alert('Preencha os campos obrigatórios!'); return; }

  if (budgetVal > 0) await set(ref(db, budgetPath()), budgetVal);
  await push(ref(db, expPath()), { desc, value, cat, date, user: currentUser });

  document.getElementById('exp-desc').value = '';
  document.getElementById('exp-value').value = '';
  await renderExpenses();
  await updateSummary();
}

window.deleteExpense = async function(id) {
  await remove(ref(db, `${expPath()}/${id}`));
  await renderExpenses();
  await updateSummary();
}

window.addBill = async function() {
  const name   = document.getElementById('bill-name').value.trim();
  const value  = parseFloat(document.getElementById('bill-value').value);
  const numP   = parseInt(document.getElementById('bill-pessoas').value);
  const nRaw   = document.getElementById('bill-nomes').value.trim();

  if (!name || !value) return;

  const nomes = nRaw ? nRaw.split(',').map(n=>n.trim()).filter(Boolean) : [];
  while (nomes.length < numP) nomes.push(`Pessoa ${nomes.length+1}`);

  const participantes = {};
  nomes.slice(0,numP).forEach((n,i) => { participantes[`p${i}`] = { nome: n, pago: false }; });

  await push(ref(db, billPath()), {
    name, value, parcela: value/numP, criadoPor: currentUser, participantes
  });
}

window.togglePago = async function(billId, pKey) {
  const snap = await get(ref(db, `${billPath()}/${billId}/participantes/${pKey}/pago`));
  await set(ref(db, `${billPath()}/${billId}/participantes/${pKey}/pago`), !snap.val());
}

window.deleteBill = async function(id) {
  await remove(ref(db, `${billPath()}/${id}`));
}

async function renderExpenses() {
  const snap = await get(ref(db, expPath()));
  const data = snap.val() || {};
  const list = document.getElementById('expense-list');
  const items = Object.entries(data).sort((a,b) => b[1].date.localeCompare(a[1].date));

  list.innerHTML = items.length ? items.map(([id,e]) => {
    const d = new Date(e.date+'T12:00:00');
    const ds = d.toLocaleDateString('pt-BR');
    return `<div class="expense-item">
      <div class="expense-info">
        <div class="expense-desc">${e.desc} <span class="badge">${e.cat}</span></div>
        <div class="expense-meta">${ds}</div>
      </div>
      <span class="expense-amount">${fmt(e.value)}</span>
      <button class="btn btn-danger" onclick="deleteExpense('${id}')">✕</button>
    </div>`;
  }).join('') : `<div class="empty">Nenhum gasto este mês.</div>`;
  renderChart(data);
}

function renderChart(data) {
  const totals = {};
  for (const e of Object.values(data)) totals[e.cat] = (totals[e.cat]||0) + e.value;
  const labels = Object.keys(totals);
  const values = Object.values(totals);
  const colors = labels.map(l => CAT_COLORS[l]||'#fff');

  if (catChart) catChart.destroy();
  const ctx = document.getElementById('catChart').getContext('2d');
  catChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} } }
  });

  const total = values.reduce((a,b)=>a+b,0);
  document.getElementById('category-breakdown').innerHTML = labels.map((l,i) => `
    <div class="budget-row">
      <span>${l}</span>
      <span>${fmt(values[i])} (${Math.round((values[i]/total)*100)}%)</span>
    </div>
  `).join('');
}

function renderBills() {
  get(ref(db, billPath())).then(snap => {
    const data = snap.val() || {};
    const container = document.getElementById('bills-list');
    container.innerHTML = Object.entries(data).map(([id,b]) => `
      <div class="conta-item">
        <div class="conta-header">
          <strong>${b.name}</strong>
          <span>${fmt(b.value)}</span>
          <button class="btn btn-danger btn-sm" onclick="deleteBill('${id}')">✕</button>
        </div>
        ${Object.entries(b.participantes||{}).map(([pKey,p]) => `
          <div class="participante-row">
            <span>${p.nome}</span>
            <span class="status ${p.pago?'status-pago':'status-pendente'}" onclick="togglePago('${id}','${pKey}')">
              ${p.pago ? 'Pago' : 'Pendente'}
            </span>
          </div>`).join('')}
      </div>`).join('') || `<div class="empty">Nenhuma conta.</div>`;
  });
}

async function updateSummary() {
  const [expSnap, budgetSnap] = await Promise.all([get(ref(db, expPath())), get(ref(db, budgetPath()))]);
  const expenses = Object.values(expSnap.val()||{});
  const total = expenses.reduce((a,e)=>a+e.value,0);
  const budget = budgetSnap.val()||0;

  document.getElementById('summary-budget').textContent = fmt(budget);
  document.getElementById('summary-spent').textContent = fmt(total);
  document.getElementById('summary-remaining').textContent = fmt(budget - total);
  document.getElementById('current-month').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
}

async function render() {
  await renderExpenses();
  renderBills();
  await updateSummary();
}
</script>

<style>
:root {
  --bg-dark: #0a192f;        /* Azul Escuro Profundo */
  --bg-secondary: #112240;   /* Azul Marinho para inputs */
  --card-blue: #87ceeb;      /* Sky Blue */
  --text-white: #ffffff;
  --accent-cyan: #00d4ff;
  --danger: #ff5252;
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Montserrat', sans-serif; 
  background-color: var(--bg-dark); 
  color: var(--text-white); 
  line-height: 1.6;
}

header { 
  background: var(--bg-secondary); 
  padding: 1rem 2rem; 
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  border-bottom: 2px solid var(--accent-cyan);
}

.container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

/* Grid de Cards */
.summary-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
  gap: 1.5rem; 
  margin-bottom: 2rem; 
}

.summary-card { 
  background: var(--card-blue); 
  color: #0a192f; /* Texto escuro no card claro para contraste */
  padding: 1.5rem; 
  border-radius: var(--radius);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  text-align: center;
}

.summary-card h3 { font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem; opacity: 0.8; }
.summary-card .card-value { font-size: 1.5rem; font-weight: 700; }

/* Painéis de Formulário e Listas */
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }

.panel { 
  background: var(--bg-secondary); 
  padding: 1.5rem; 
  border-radius: var(--radius); 
  border: 1px solid rgba(255,255,255,0.1);
}

h2 { margin-bottom: 1.5rem; color: var(--accent-cyan); font-size: 1.2rem; }

/* Estilo dos Inputs */
input, select { 
  width: 100%; 
  padding: 12px; 
  margin-bottom: 1rem; 
  background: var(--bg-dark); 
  border: 1px solid var(--accent-cyan); 
  border-radius: 8px; 
  color: white; 
  font-family: inherit;
}

.btn { 
  cursor: pointer; 
  border: none; 
  padding: 12px 20px; 
  border-radius: 8px; 
  font-weight: 600; 
  transition: 0.3s;
}

.btn-primary { background: var(--accent-cyan); color: var(--bg-dark); width: 100%; }
.btn-primary:hover { background: #87ceeb; transform: translateY(-2px); }

.btn-danger { background: var(--danger); color: white; padding: 5px 10px; }

/* Lista de Gastos */
.expense-item { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  background: rgba(255,255,255,0.05); 
  padding: 12px; 
  border-radius: 8px; 
  margin-bottom: 0.8rem;
}

.badge { background: var(--accent-cyan); color: var(--bg-dark); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }

/* Contas a Dividir */
.conta-item { background: var(--card-blue); color: #0a192f; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
.conta-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; }

.participante-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem; }
.status { cursor: pointer; font-weight: bold; font-size: 0.8rem; padding: 2px 8px; border-radius: 10px; }
.status-pendente { background: #ffeb3b; color: #000; }
.status-pago { background: #4caf50; color: #fff; }

#screen-login { 
  height: 100vh; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  background: linear-gradient(135deg, var(--bg-dark) 0%, #1a3a6d 100%);
}
.login-box { background: var(--bg-secondary); padding: 3rem; border-radius: var(--radius); width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }

@media (max-width: 768px) {
  .main-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="screen-login">
  <div class="login-box">
    <h1 style="text-align:center; color:var(--accent-cyan); margin-bottom:1.5rem">SalvaMoney</h1>
    <input type="text" id="l-nome" placeholder="Seu nome" />
    <input type="text" id="l-grupo" placeholder="Código do Grupo" />
    <div style="margin-bottom:1rem; display:flex; gap:10px">
      <label><input type="radio" name="acao" value="entrar" checked> Entrar</label>
      <label><input type="radio" name="acao" value="criar"> Criar</label>
    </div>
    <button class="btn btn-primary" onclick="entrar()">Acessar Sistema</button>
    <div id="login-msg"></div>
  </div>
</div>

<div id="screen-app" style="display:none">
  <header>
    <div><strong>SalvaMoney</strong> | <span id="header-group"></span></div>
    <div style="display:flex; align-items:center; gap:15px">
      <button class="btn" style="background:none; color:white" onclick="changeMonth(-1)">◀</button>
      <span id="current-month" style="font-weight:bold"></span>
      <button class="btn" style="background:none; color:white" onclick="changeMonth(1)">▶</button>
    </div>
    <div>👤 <span id="header-user"></span> | <button onclick="sair()" style="background:none; border:none; color:var(--danger); cursor:pointer">Sair</button></div>
  </header>

  <div class="container">
    <div class="summary-grid">
      <div class="summary-card">
        <h3>Orçamento</h3>
        <div class="card-value" id="summary-budget">R$ 0,00</div>
      </div>
      <div class="summary-card">
        <h3>Gasto Total</h3>
        <div class="card-value" id="summary-spent">R$ 0,00</div>
      </div>
      <div class="summary-card">
        <h3>Saldo Restante</h3>
        <div class="card-value" id="summary-remaining">R$ 0,00</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="panel">
        <h2>Novo Lançamento</h2>
        <input type="text" id="exp-desc" placeholder="Descrição (ex: Jantar)" />
        <input type="number" id="exp-value" placeholder="Valor (R$)" />
        <select id="exp-cat">
          <option value="Alimentação">Alimentação</option>
          <option value="Moradia">Moradia</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Saúde">Saúde</option>
          <option value="Outros">Outros</option>
        </select>
        <input type="date" id="exp-date" />
        <input type="number" id="budget-input" placeholder="Definir Orçamento Mensal" />
        <button class="btn btn-primary" onclick="addExpense()">Salvar Gasto</button>
      </div>

      <div class="panel">
        <h2>Histórico do Mês</h2>
        <div id="expense-list"></div>
      </div>

      <div class="panel">
        <h2>Gráfico</h2>
        <div style="height:200px"><canvas id="catChart"></canvas></div>
        <div id="category-breakdown" style="margin-top:1rem"></div>
      </div>

      <div class="panel">
        <h2>Divisão de Contas</h2>
        <input type="text" id="bill-name" placeholder="Nome da Conta (ex: Aluguel)" />
        <input type="number" id="bill-value" placeholder="Valor Total" />
        <input type="number" id="bill-pessoas" value="2" placeholder="Nº Pessoas" />
        <input type="text" id="bill-nomes" placeholder="Nomes (separados por vírgula)" />
        <button class="btn btn-primary" onclick="addBill()">Adicionar Conta Coletiva</button>
        <div id="bills-list" style="margin-top:1rem"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
